# DeskBot Commands Spec

version: 1.0

commands:
  - name: system.status
    desc: Get system status
    args: {}

  - name: system.reset
    desc: Reset MCU or host controller
    args:
      mode: soft|hard

  - name: motion.move
    desc: Move robot base
    args:
      speed: int
      direction: forward|backward|left|right|stop

  - name: ui.update
    desc: Update LVGL UI state
    args:
      page: string
      payload: object

  - name: sensor.read
    desc: Read sensor data
    args:
      type: string
